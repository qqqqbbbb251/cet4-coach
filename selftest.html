<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>selftest</title>
</head>
<body>
<header id="appbar">
  <div class="bar-inner">
    <button id="btn-home" class="brand">四级备考 · CET-4</button>
    <div class="bar-actions">
      <button id="btn-dash" class="icon-btn" aria-label="仪表盘"></button>
      <button id="btn-theme" class="icon-btn" aria-label="深色模式"></button>
      <button id="btn-settings" class="icon-btn" aria-label="设置"></button>
    </div>
  </div>
</header>
<main id="main"></main>
<div id="toast" class="toast"></div>
<pre id="selftest-results"></pre>

<script>
  /* 跳过首屏引导，避免弹窗干扰测试 */
  try { localStorage.setItem("cet4_seen", "true"); } catch (e) { }
</script>
<script src="data/data.js?v=13"></script>
<script src="data/zhenti.js?v=13"></script>
<script src="data/zaudio.js?v=13"></script>
<script src="data/wordmeta.js?v=13"></script>
<script src="data/roots.js?v=13"></script>
<script src="data/eztor.js?v=13"></script>
<script src="data/papers.js?v=13"></script>
<script src="data/words_extra.js?v=13"></script>
<script src="data/vocabtest.js?v=13"></script>
<script src="data/wordcolloc.js?v=13"></script>
<script src="data/voa.js?v=13"></script>
<script src="data/dict.js?v=13"></script>
<script src="data/grammar.js?v=13"></script>
<script src="data/wordform.js?v=13"></script>
<script src="data/waudio.js?v=13"></script>
<script src="app.js?v=13"></script>
<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function ok(name, cond, extra) {
    if (cond) { pass++; out.push("PASS " + name); }
    else { fail++; out.push("FAIL " + name + (extra != null ? (" :: " + extra) : "")); }
  }
  function finish() {
    document.getElementById("selftest-results").textContent = out.join("\n");
    document.title = "SELFTEST " + (fail ? "FAIL" : "PASS") + " " + pass + "/" + (pass + fail) + (fail ? (" (" + out.filter(function (l) { return l.indexOf("FAIL") === 0; }).join(" | ") + ")") : "");
  }

  /* ---- 假 fetch 拦截 AI 与词典请求 ---- */
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    url = String(url);
    if (url.indexOf("/chat/completions") >= 0) {
      var body = JSON.stringify({ choices: [{ message: { content: "## 综合得分\n12/15\n\n## 总体评价\nselftest 假响应。" } }] });
      return Promise.resolve({ ok: true, status: 200, text: function () { return Promise.resolve(body); } });
    }
    if (url.indexOf("dictionaryapi.dev") >= 0) {
      return Promise.resolve({ ok: false, status: 404, json: function () { return Promise.resolve(null); } });
    }
    return origFetch ? origFetch.apply(window, arguments) : Promise.reject(new Error("no fetch"));
  };
  /* ---- 无头环境没有语音，stub 掉 TTS ---- */
  try {
    window.SpeechSynthesisUtterance = window.SpeechSynthesisUtterance || function () { };
    if (!window.speechSynthesis) window.speechSynthesis = { speak: function () { }, getVoices: function () { return []; } };
  } catch (e) { }

  localStorage.setItem("cet4_settings", JSON.stringify({ apiKey: "test-key", baseUrl: "https://api.deepseek.com", model: "deepseek-flash" }));
  ["cet4_progress", "cet4_wrong", "cet4_srs", "cet4_records", "cet4_vt_history"].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) { } });

  function q(s, r) { return (r || document).querySelector(s); }
  function qa(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

  q("#btn-home").click();
  ok("home renders 6 categories", qa("#main [data-cat]").length === 6, "got " + qa("#main [data-cat]").length);
  ok("offline dictionary loaded", !!window.CET4_DICT && Object.keys(window.CET4_DICT).length >= 8000, "entries=" + (window.CET4_DICT ? Object.keys(window.CET4_DICT).length : 0));
  ok("word-form data loaded", !!window.CET4_WORDFORM && Object.keys(window.CET4_WORDFORM).length >= 5000, "entries=" + (window.CET4_WORDFORM ? Object.keys(window.CET4_WORDFORM).length : 0));
  ok("word-audio map loaded", !!window.CET4_WAUDIO && Object.keys(window.CET4_WAUDIO).length >= 100, "entries=" + (window.CET4_WAUDIO ? Object.keys(window.CET4_WAUDIO).length : 0));
  q("#btn-settings").click();
  ok("settings has cloud-restore button", !!q("#set-restore"));
  ok("settings has full data export", !!q("#set-data"));
  q("#set-data").click();
  ok("data modal has local-backup restore", !!q("#io-bakrestore"));
  q("#io-close").click();
  q("#set-close").click();

  var cats = ["words", "exam", "skill", "ai", "me", "more"];
  cats.forEach(function (c) {
    q("#btn-home").click();
    var el = q('#main [data-cat="' + c + '"]');
    ok("category " + c + " present", !!el);
    if (!el) return;
    el.click();
    var mods = qa("#main [data-go]");
    ok("category " + c + " has modules", mods.length > 0, "got " + mods.length);
    mods.forEach(function (m) {
      var key = m.getAttribute("data-go");
      try {
        q("#btn-home").click();
        var cat = q('#main [data-cat="' + c + '"]'); if (cat) cat.click();
        var mm = q('#main [data-go="' + key + '"]');
        if (!mm) { ok("open " + key, false, "button missing"); return; }
        mm.click();
        ok("open " + key, true);
      } catch (e) { ok("open " + key, false, String(e && e.message || e)); }
    });
  });

  try {
    q("#btn-home").click();
    q('#main [data-cat="words"]').click();
    q('#main [data-go="vocab"]').click();
    ok("vocab study renders cards", qa("#vocab-body .card").length > 0);
  } catch (e) { ok("vocab study renders cards", false, String(e)); }

  function testVocabThenAI() {
    /* ---- 单词量测试：阅读模式，程序自动作答到出结果 ---- */
    try {
      localStorage.setItem("cet4_vt_mode", "reading");
      q("#btn-home").click();
      q('#main [data-cat="words"]').click();
      q('#main [data-go="vtest"]').click();
      ok("vocab-test intro renders", !!q("#vt-start"));
      q("#vt-start").click();
      ok("vocab-test has 不认识 option", !!q("#vt-dk"));
      var guard = 0;
      var timer = setInterval(function () {
        if (q("#vt-again")) {
          clearInterval(timer);
          ok("vocab-test results render", /阅读词汇/.test(document.getElementById("main").textContent));
          testGrammar();
          return;
        }
        if (++guard > 400) { clearInterval(timer); ok("vocab-test completes", false, "timeout"); testAI(); return; }
        var opt = q("#main .opt");
        if (opt) { opt.click(); return; }
        var inp = q("#vt-in");
        if (inp) { inp.value = ""; var nb = q("#vt-next"); if (nb) nb.click(); }
      }, 200);
    } catch (e) { ok("vocab-test flow", false, String(e)); testAI(); }
  }

  function testGrammar() {
    try {
      q("#btn-home").click();
      q('#main [data-cat="skill"]').click();
      q('#main [data-go="grammar"]').click();
      ok("grammar list renders", qa('#main [data-gid]').length >= 30, "topics=" + qa('#main [data-gid]').length);
      q('#main [data-gid]').click();
      ok("grammar detail has examples", qa('#main .card').length > 3, "cards=" + qa('#main .card').length);
      var opt = q('#main .grammar-quiz .opt');
      ok("grammar quiz present", !!opt);
      if (opt) { opt.click(); ok("grammar quiz explanation", !!q('#main .grammar-quiz .explain')); }
    } catch (e) { ok("grammar flow", false, String(e)); }
    testListening();
  }

  function testListening() {
    try {
      q("#btn-home").click();
      q('#main [data-cat="skill"]').click();
      q('#main [data-go="listening"]').click();
      var first = q('#main [data-idx="0"]');
      ok("listening list has items", !!first);
      first.click();
      ok("listening has dictation inputs", qa('#main [data-din]').length > 0, "inputs=" + qa('#main [data-din]').length);
      var inp = q('#main [data-din]');
      if (inp) {
        inp.value = "the test sentence";
        var chk = q('#main [data-dchk]'); chk.click();
        ok("dictation check renders result", !!q('#main [data-dres]') && q('#main [data-dres]').textContent.length > 0);
      }
    } catch (e) { ok("listening dictation flow", false, String(e)); }
    testPlan();
  }

  function testPlan() {
    try {
      q("#btn-home").click();
      q('#main [data-cat="me"]').click();
      q('#main [data-go="plan"]').click();
      ok("plan shows profile form", !!q("#pf-save"));
      q("#pf-save").click();
      ok("plan shows daily questionnaire", !!q("#q-go"));
      q("#q-go").click();
      setTimeout(function () {
        ok("plan renders tasks", qa('#main [data-task]').length > 0, "tasks=" + qa('#main [data-task]').length);
        ok("plan persisted to cet4_daily", !!localStorage.getItem("cet4_daily"));
        testAI();
      }, 900);
    } catch (e) { ok("plan flow", false, String(e)); testAI(); }
  }

  function testAI() {
    try {
      q("#btn-home").click();
      q('#main [data-cat="skill"]').click();
      q('#main [data-go="writing"]').click();
      var item = q('#main [data-idx="0"]');
      ok("writing list has items", !!item);
      item.click();
      var ta = q("#wr-text");
      ok("writing detail has textarea", !!ta);
      ta.value = "With the rapid development of society, many people pay attention to education. It is important for us to study hard and never give up.";
      q("#wr-grade").click();
      setTimeout(function () {
        var res = q("#wr-result .ai-result");
        ok("AI essay grade rendered", !!res && /综合得分/.test(res.textContent));
        finish();
      }, 1200);
    } catch (e) { ok("AI essay grade flow", false, String(e)); finish(); }
  }

  testVocabThenAI();
})();
</script>
</body>
</html>
